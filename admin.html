<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優乃翼｜管理</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <a href="index.html" class="back">← 公開サイト</a>
  <div><strong>優乃翼</strong><small>データ管理</small></div>
</header>
<main>
  <section class="notice">
    <h1>鳩データ管理</h1>
    <p>スマートフォンから登録内容を確認・編集するための管理画面です。</p>
  </section>

  <nav class="tabs">
    <button class="active" data-view="list">登録鳩</button>
    <button data-view="edit">＋ 新規登録</button>
  </nav>

  <section id="listView" class="view">
    <label class="search"><span>登録鳩を検索</span><input id="q" type="search" placeholder="脚環番号・個体名・血統など"></label>
    <div id="count" class="count"></div>
    <div id="birds"></div>
  </section>

  <section id="editView" class="view" hidden>
    <form id="birdForm">
      <div class="form-head"><button type="button" id="backList">←</button><h2 id="formTitle">新規登録</h2></div>
      <div id="fields"></div>
      <div class="sticky-save"><button type="submit">入力内容を保存</button></div>
    </form>
  </section>
</main>

</body>
</html>

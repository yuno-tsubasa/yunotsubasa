<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優乃翼｜データ管理</title>
<link rel="stylesheet" href="data.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="top">
  <div><div class="brand-main">優乃翼</div><div class="brand-sub">レース鳩データ管理</div></div>
  <button id="settingsButton" class="ghost" type="button">接続設定</button>
</header>
<main>
  <section id="setupPanel" class="panel setup">
    <h1>スプレッドシートを接続</h1>
    <p>初回だけGoogleスプレッドシートのURLを入力してください。この端末に180日間保存します。</p>
    <label class="field"><span>GoogleスプレッドシートURL</span><input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..."></label>
    <label class="field"><span>シート名</span><input id="sheetName" type="text" value="鳩データベース"></label>
    <button id="connectButton" class="primary" type="button">接続する</button>
    <div id="setupMessage" class="message"></div>
  </section>

  <section id="dataPanel" hidden>
    <section class="panel authbar">
      <div><div class="eyebrow">編集権限</div><div id="authStatus">閲覧のみ</div></div>
      <button id="googleLoginButton" class="secondary" type="button">Googleで編集を有効化</button>
    </section>

    <section class="panel">
      <label class="field">
        <span>検索文字を入力</span>
        <div class="search-row">
          <input id="keyword" type="search" placeholder="脚環番号・個体名・血統など">
          <button id="searchButton" class="search-button" type="button">検索する</button>
        </div>
      </label>

      <div class="filters">
        <select id="sexFilter"><option value="">性別：すべて</option><option>♂</option><option>♀</option><option>不明</option></select>
        <select id="statusFilter"><option value="">状態：すべて</option><option>販売中</option><option>商談中</option><option>売約済</option><option>非売品</option></select>
      </div>

      <div class="result-row">
        <span id="resultCount">0件</span>
        <div class="result-actions">
          <button id="clearButton" class="text-button" type="button">条件をクリア</button>
          <button id="newButton" class="secondary" type="button">＋ 新規登録</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div id="loading" class="empty">読み込み中…</div>
      <div id="error" class="error-box" hidden></div>
      <div id="birdList"></div>
      <div id="empty" class="empty" hidden>条件に合う鳩がありません。</div>
    </section>
  </section>
</main>

<dialog id="editModal">
  <button id="closeEdit" class="modal-close" type="button">×</button>
  <h2 id="editTitle">編集</h2>
  <form id="editForm">
    <div id="editFields"></div>

    <section class="image-section">
      <h3>写真</h3>

      <div class="image-block">
        <div class="image-title">鳩本体写真</div>
        <img id="bodyPreview" class="preview" alt="鳩本体写真">
        <input id="bodyImageFile" type="file" accept="image/*">
      </div>

      <div class="image-block">
        <div class="image-title">目の写真</div>
        <img id="eyePreview" class="preview" alt="目の写真">
        <input id="eyeImageFile" type="file" accept="image/*">
      </div>

      <div class="image-block">
        <div class="image-title">血統書画像</div>
        <img id="pedigreePreview" class="preview" alt="血統書画像">
        <input id="pedigreeImageFile" type="file" accept="image/*">
      </div>
    </section>

    <button id="saveButton" class="primary save-fixed" type="submit">保存する</button>
    <button id="deleteButton" class="danger" type="button">削除する</button>
    <div id="editMessage" class="message"></div>
  </form>
</dialog>

</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優乃翼｜データ管理</title>
<link rel="stylesheet" href="data.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header class="top">
  <div>
    <div class="brand-main">優乃翼</div>
    <div class="brand-sub">レース鳩データ管理</div>
  </div>
  <button id="settingsButton" class="ghost" type="button">接続設定</button>
</header>

<main>
  <section id="setupPanel" class="panel setup">
    <h1>スプレッドシートを接続</h1>
    <p>初回だけGoogleスプレッドシートのURLを入力してください。この端末に180日間保存します。</p>
    <label class="field"><span>GoogleスプレッドシートURL</span><input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..."></label>
    <label class="field"><span>シート名</span><input id="sheetName" type="text" value="鳩データベース"></label>
    <button id="connectButton" class="primary" type="button">接続する</button>
    <div id="setupMessage" class="message"></div>
  </section>

  <section id="dataPanel" hidden>
    <section class="panel authbar">
      <div>
        <div class="eyebrow">編集権限</div>
        <div id="authStatus">閲覧のみ</div>
      </div>
      <button id="googleLoginButton" class="secondary" type="button">Googleで編集を有効化</button>
    </section>

    <section class="panel">
      <label class="field"><span>登録鳩を検索</span><input id="keyword" type="search" placeholder="脚環番号・個体名・血統など"></label>
      <div class="result-row"><span id="resultCount">0件</span><button id="newButton" class="secondary" type="button">＋ 新規登録</button></div>
    </section>

    <section class="panel">
      <div id="loading" class="empty">読み込み中…</div>
      <div id="error" class="error-box" hidden></div>
      <div id="birdList"></div>
    </section>
  </section>
</main>

<dialog id="editModal">
  <button id="closeEdit" class="modal-close" type="button">×</button>
  <h2 id="editTitle">編集</h2>
  <form id="editForm">
    <div id="editFields"></div>
    <button id="saveButton" class="primary" type="submit">保存する</button>
    <button id="deleteButton" class="danger" type="button">削除する</button>
    <div id="editMessage" class="message"></div>
  </form>
</dialog>

<script>
window.YUNOTSUBASA_EDIT_CONFIG={
  clientId:"401865928131-7ff2k3iuohhj7nct2gebsludhmm24llu.apps.googleusercontent.com"
};
</script>
<script src="data.js"></script>
</body>
</html>
